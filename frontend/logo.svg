<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Solid rounded token container -->
  <rect width="48" height="48" rx="12" fill="#0A111E" />
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="url(#brandGrad)" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

  <!-- Bold Rupee Currency Silhouette -->
  <!-- Top bar -->
  <path d="M 13 14 L 29 14" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Mid bar -->
  <path d="M 13 20.5 L 26 20.5" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" />
  <!-- Bowl curve and stem -->
  <path d="M 19 14 V 27 C 25.5 27 25.5 20.5 19 20.5" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Diagonal leg -->
  <path d="M 19.5 26.5 L 30 38" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- AI Intelligence Spark / Node in upper-right -->
  <path d="M 37 4 L 38.8 8.5 L 43 10 L 38.8 11.5 L 37 16 L 35.2 11.5 L 31 10 L 35.2 8.5 Z" fill="url(#sparkGrad)" />
  <circle cx="37" cy="10" r="1.2" fill="#FFFFFF" />
</svg>
